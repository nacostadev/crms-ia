<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CRMS</title>
  <base href="/">
  <meta name="author" content="nacostadev">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Aplica el tema guardado antes de pintar (ver ThemeService) para evitar un destello claro.
    try {
      var t = localStorage.getItem('crms:tema');
      if (t === 'oscuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
