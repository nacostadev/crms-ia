<div class="min-h-screen bg-fondo p-0 sm:p-6">
  <div class="login-card relative flex min-h-screen overflow-hidden bg-superficie sm:min-h-[calc(100vh-3rem)] sm:rounded-[10px] lg:bg-transparent">
    <!-- Panel del formulario: en desktop es un vidrio esmerilado sobre la foto -->
    <section
      class="relative z-10 flex w-full flex-col items-center p-6 sm:rounded-l-[10px] lg:w-[49.3%] lg:bg-superficie/95 lg:backdrop-blur-[17px]"
    >
      <button
        type="button"
        class="absolute right-4 top-4 grid size-[38px] place-items-center rounded-[5px] border border-linea bg-superficie text-texto shadow-suave hover:bg-fondo sm:right-6 sm:top-6"
        (click)="theme.alternar()"
        [attr.aria-label]="theme.oscuro() ? 'Light mode' : 'Dark mode'"
        [title]="theme.oscuro() ? 'Light mode' : 'Dark mode'"
      >
        <app-icon [name]="theme.oscuro() ? 'sun' : 'moon'" />
      </button>

      <div class="flex w-full max-w-[413px] flex-1 flex-col items-center">
        <img src="assets/images/logo-crms.svg" alt="CRMS" width="141" height="31" class="mt-[7px] dark:hidden" />
        <img src="assets/images/logo-crms-dark.svg" alt="CRMS" width="141" height="31" class="mt-[7px] hidden dark:block" />

        <div class="my-auto w-full py-12">
          <app-login-form [cargando]="cargando()" [error]="error()" (enviar)="onLogin($event)" />
        </div>

        <div class="flex flex-col items-center gap-0.5 pb-[7px] text-sm">
          <p class="text-texto">Copyright © 2025 - CRMS</p>
          <p class="text-xs text-texto-suave">Developed by <span class="font-medium text-texto">nacostadev</span></p>
        </div>
      </div>
    </section>

    <!-- Foto: solo desktop; en mobile y tablet el formulario ocupa todo el ancho -->
    <div class="login-foto absolute inset-0 hidden lg:block" aria-hidden="true"></div>
  </div>
</div>
