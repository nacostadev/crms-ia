<div class="min-h-screen bg-fondo transition-[padding] duration-200" [class]="colapsado() ? 'lg:pl-[76px]' : 'lg:pl-60'">
  <app-sidebar
    [abierto]="menuAbierto()"
    [colapsado]="colapsado()"
    (cerrar)="menuAbierto.set(false)"
    (alternarColapso)="colapsado.set(!colapsado())"
  />

  <div class="flex min-h-screen flex-col">
    <app-topbar (abrirMenu)="abrirMenu()" />
    <main class="flex-1 p-4 sm:p-6">
      <router-outlet />
    </main>
    <app-footer />
  </div>
</div>
